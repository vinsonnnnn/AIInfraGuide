<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">9.1 三类探针，不是三个名字相同的开关</title>
<desc id="desc">配置startup后其成功前不执行readiness与liveness；成功后readiness管理是否就绪，liveness连续失败达阈值触发重启。健康不等于业务达标。</desc>
<defs>
<marker id="a2563eb" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/>
</marker>
<marker id="a087f67" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#087f67"/>
</marker>
<marker id="ab45309" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b45309"/>
</marker>
<marker id="ab42338" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b42338"/>
</marker>
<marker id="a7048b8" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#7048b8"/>
</marker>
<marker id="a64748b" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
</marker>
</defs>
<rect width="1200" height="870" rx="24" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="65" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">9.1 三类探针，不是三个名字相同的开关</text>
<text x="48" y="112" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">同样访问 /health，失败后的动作也可以完全不同</text>
<rect x="48" y="158" width="1104" height="157" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="72" y="205" font-size="29" fill="#2563eb" font-weight="700" text-anchor="start">启动阶段：Startup Probe</text>
<text x="72" y="248" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">给模型加载与初始化留预算；本次容器启动成功后，不再周期运行它。</text>
<text x="72" y="289" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">Startup 尚未成功时，配置中的 Readiness 与 Liveness 暂不执行。</text>
<path d="M 300 315 V 389" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#a2563eb)"/>
<path d="M 900 315 V 389" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#a2563eb)"/>
<text x="600" y="365" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">Startup 成功后，两类检查分别周期运行</text>
<rect x="48" y="404" width="524" height="257" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="72" y="451" font-size="27" fill="#b45309" font-weight="700" text-anchor="start">Readiness：接不接新流量</text>
<text x="72" y="501" font-size="26" fill="#172b4d" font-weight="400" text-anchor="start">现在是否就绪？</text>
<text x="72" y="559" font-size="24" fill="#b45309" font-weight="700" text-anchor="start">未就绪 → 暂不作为常规流量目标</text>
<text x="72" y="618" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">这项检查失败本身不直接重启容器</text>
<rect x="628" y="404" width="524" height="257" rx="16" fill="#fff7f7" stroke="#fecdd3" stroke-width="2"/>
<text x="652" y="451" font-size="27" fill="#b42338" font-weight="700" text-anchor="start">Liveness：要不要重启</text>
<text x="652" y="501" font-size="26" fill="#172b4d" font-weight="400" text-anchor="start">是否需要通过重启恢复？</text>
<text x="652" y="559" font-size="24" fill="#b42338" font-weight="700" text-anchor="start">连续失败到阈值 → 重启容器</text>
<text x="652" y="618" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">不能仅因某条生成较慢就判定必需重启</text>
<rect x="48" y="710" width="1104" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="72" y="754" font-size="25" fill="#172b4d" font-weight="700" text-anchor="start">健康端点成功，只证明这项检查通过；还需真实生成、质量与 SLO 验收。</text>
<text x="72" y="797" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">流量摘除有传播过程，既有请求也需要单独安排排空与退出。</text>
</g>
</svg>