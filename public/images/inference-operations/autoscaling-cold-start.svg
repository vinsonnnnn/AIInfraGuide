<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">9.3 多一个期望副本，不等于立刻多一份处理能力</title>
<desc id="desc">90秒冷启动期间净积压900条。之后容量20每秒恰等于到达率时积压保持；若容量30每秒，以每秒10条净排空再需90秒。</desc>
<defs>
<marker id="a2563eb" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/>
</marker>
<marker id="a087f67" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#087f67"/>
</marker>
<marker id="ab45309" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b45309"/>
</marker>
<marker id="ab42338" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b42338"/>
</marker>
<marker id="a7048b8" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#7048b8"/>
</marker>
<marker id="a64748b" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
</marker>
</defs>
<rect width="1200" height="930" rx="24" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="65" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">9.3 多一个期望副本，不等于立刻多一份处理能力</text>
<text x="48" y="112" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">教学假设：到达 20 请求/s，旧容量 10 请求/s，新副本 90 秒后可用</text>
<text x="48" y="152" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">从“已提出扩容”开始计时；以下分段时长只用于说明，真实步骤可重叠</text>
<rect x="60" y="193" width="120" height="72" rx="5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<text x="120.0" y="222" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">调度</text>
<text x="120.0" y="251" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">10 s</text>
<rect x="180" y="193" width="240" height="72" rx="5" fill="#7048b8" stroke="#ffffff" stroke-width="2"/>
<text x="300.0" y="222" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">镜像</text>
<text x="300.0" y="251" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">20 s</text>
<rect x="420" y="193" width="480" height="72" rx="5" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
<text x="660.0" y="222" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">模型加载</text>
<text x="660.0" y="251" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">40 s</text>
<rect x="900" y="193" width="240" height="72" rx="5" fill="#087f67" stroke="#ffffff" stroke-width="2"/>
<text x="1020.0" y="222" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">预热 / 就绪</text>
<text x="1020.0" y="251" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">20 s</text>
<text x="60" y="302" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">0 s</text>
<text x="180" y="302" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">10 s</text>
<text x="420" y="302" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">30 s</text>
<text x="900" y="302" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">70 s</text>
<text x="1140" y="302" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">90 s</text>
<text x="48" y="362" font-size="28" fill="#b42338" font-weight="700" text-anchor="start">扩容等待期：净积压约 (20 − 10) × 90 = 900 条</text>
<path d="M 180 667 V 405" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a64748b)"/>
<path d="M 180 667 H 1110" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a64748b)"/>
<text x="55" y="418" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">积压数</text>
<text x="160" y="452" font-size="22" fill="#172b4d" font-weight="400" text-anchor="end">900</text>
<text x="160" y="676" font-size="22" fill="#172b4d" font-weight="400" text-anchor="end">0</text>
<path d="M 180 667 L 630 442" fill="none" stroke="#b42338" stroke-width="5"/>
<path d="M 630 442 H 1080" fill="none" stroke="#b45309" stroke-width="5" stroke-dasharray="10 7"/>
<path d="M 630 442 L 1080 667" fill="none" stroke="#087f67" stroke-width="5"/>
<text x="180" y="707" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">0 s</text>
<text x="630" y="707" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">90 s</text>
<text x="1080" y="707" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">180 s</text>
<text x="708" y="418" font-size="23" fill="#b45309" font-weight="700" text-anchor="start">若新总容量 = 20/s：只是不再增长</text>
<text x="700" y="735" font-size="23" fill="#087f67" font-weight="700" text-anchor="start">若新总容量 = 30/s：再用约 90 s 排空</text>
<rect x="48" y="757" width="1104" height="129" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="72" y="802" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">图是假设无拒绝、取消、超时且速率恒定的流量账本，不是请求延迟预测。</text>
<text x="72" y="846" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">扩容期间仍需基础余量与有界准入；等待过久的用户体验无法事后补回。</text>
</g>
</svg>