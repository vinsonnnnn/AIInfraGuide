<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
  <title id="title">生产推理服务的请求与控制路径</title>
  <desc id="desc">客户端经网关认证和流式转发，由 Router 选择就绪的独立模型副本。各副本有自己的权重、KV 与队列。探针决定就绪及重启判断；监控采集指标，经适配器向 HPA 提供信息。HPA 调整期望副本，Deployment 与调度器创建和加载模型，新副本就绪后才可接请求。</desc>
  <defs>
    <marker id="data" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2763c9"/></marker>
    <marker id="control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a59b4"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#18324f;font-size:23px}
      .title{font-size:34px;font-weight:700}.heading{font-size:27px;font-weight:700}.small{font-size:20px}.muted{fill:#52657b}.blue{fill:#245bcb}.purple{fill:#7543a2}.strong{font-weight:700}
      .d{fill:none;stroke:#2763c9;stroke-width:3;marker-end:url(#data)}.c{fill:none;stroke:#8a59b4;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#control)}
    </style>
  </defs>
  <rect width="1200" height="1160" rx="20" fill="#f1f5f9"/>
  <text x="36" y="58" class="title">生产服务：请求走实线，管理反馈走虚线</text>
  <text x="36" y="94" class="small muted">概念图：这些角色需要实际部署与连接，不会由一个 YAML 自动全部生成。</text>
  <rect x="30" y="120" width="1140" height="180" rx="16" fill="white" stroke="#d5e0ed"/>
  <rect x="55" y="160" width="220" height="100" rx="12" fill="#eaf1ff" stroke="#94b4f7"/>
  <text x="165" y="203" text-anchor="middle" class="heading">客户端</text>
  <text x="165" y="237" text-anchor="middle" class="small">发请求、接流、取消</text>
  <rect x="365" y="150" width="350" height="120" rx="12" fill="#eaf1ff" stroke="#94b4f7"/>
  <text x="540" y="190" text-anchor="middle" class="heading">网关 / 服务入口</text>
  <text x="540" y="224" text-anchor="middle" class="small">身份、TLS、配额、超时</text>
  <text x="540" y="252" text-anchor="middle" class="small">保留流式输出与取消语义</text>
  <rect x="805" y="150" width="335" height="120" rx="12" fill="#eaf1ff" stroke="#94b4f7"/>
  <text x="972" y="192" text-anchor="middle" class="heading">Router</text>
  <text x="972" y="227" text-anchor="middle" class="small">选兼容、就绪、有容量的副本</text>
  <text x="972" y="254" text-anchor="middle" class="small">结合排队与可能的缓存复用</text>
  <path d="M275 210H355" class="d"/>
  <path d="M715 210H795" class="d"/>
  <path d="M972 270V325H310V358" class="d"/>
  <path d="M972 325H890V358" class="d"/>
  <text x="55" y="292" class="small blue">请求向下分流；结果沿相应入口返回</text>
  <rect x="55" y="365" width="510" height="170" rx="14" fill="#eef9f2" stroke="#90cda6"/>
  <text x="310" y="408" text-anchor="middle" class="heading">模型副本 A</text>
  <text x="310" y="447" text-anchor="middle">固定模型权重 + 自有 KV Cache</text>
  <text x="310" y="480" text-anchor="middle">自有队列 + GPU Worker</text>
  <text x="310" y="512" text-anchor="middle" class="small muted">一个副本也可以在内部使用多卡</text>
  <rect x="635" y="365" width="510" height="170" rx="14" fill="#eef9f2" stroke="#90cda6"/>
  <text x="890" y="408" text-anchor="middle" class="heading">模型副本 B</text>
  <text x="890" y="447" text-anchor="middle">相同契约的另一份计算路径</text>
  <text x="890" y="480" text-anchor="middle">KV 默认不会与 A 自动共享</text>
  <text x="890" y="512" text-anchor="middle" class="small muted">副本数与 TP 卡数是不同概念</text>
  <rect x="30" y="585" width="330" height="170" rx="14" fill="#f3edfa" stroke="#c1a2de"/>
  <text x="195" y="625" text-anchor="middle" class="heading purple">探针</text>
  <text x="195" y="661" text-anchor="middle" class="small">Startup：启动完成？</text>
  <text x="195" y="693" text-anchor="middle" class="small">Readiness：应接新流量？</text>
  <text x="195" y="725" text-anchor="middle" class="small">Liveness：需要重启？</text>
  <path d="M195 585V541" class="c"/>
  <rect x="425" y="585" width="350" height="170" rx="14" fill="#f3edfa" stroke="#c1a2de"/>
  <text x="600" y="625" text-anchor="middle" class="heading purple">观测与指标</text>
  <text x="600" y="662" text-anchor="middle" class="small">Prometheus、日志、看板</text>
  <text x="600" y="694" text-anchor="middle" class="small">队列、KV、延迟、错误</text>
  <text x="600" y="726" text-anchor="middle" class="small">多副本逐个采集，保留身份</text>
  <path d="M520 535V570H530V581" class="c"/>
  <path d="M890 535V565H705V581" class="c"/>
  <rect x="840" y="585" width="330" height="170" rx="14" fill="#f3edfa" stroke="#c1a2de"/>
  <text x="1005" y="625" text-anchor="middle" class="heading purple">HPA</text>
  <text x="1005" y="664" text-anchor="middle" class="small">通过指标 API 获取信号</text>
  <text x="1005" y="698" text-anchor="middle" class="small">计算期望副本与变化速度</text>
  <text x="1005" y="730" text-anchor="middle" class="small">不直接创造 GPU</text>
  <path d="M775 670H833" class="c"/>
  <text x="803" y="650" text-anchor="middle" class="small purple">适配器</text>
  <path d="M1005 755V820" class="c"/>
  <rect x="810" y="827" width="350" height="115" rx="12" fill="white" stroke="#bccbda"/>
  <text x="985" y="871" text-anchor="middle" class="heading">Deployment</text>
  <text x="985" y="911" text-anchor="middle" class="small">声明并管理期望副本</text>
  <rect x="420" y="827" width="330" height="115" rx="12" fill="white" stroke="#bccbda"/>
  <text x="585" y="871" text-anchor="middle" class="heading">调度与加载</text>
  <text x="585" y="911" text-anchor="middle" class="small">GPU、存储、权重与预热</text>
  <rect x="40" y="827" width="320" height="115" rx="12" fill="white" stroke="#bccbda"/>
  <text x="200" y="871" text-anchor="middle" class="heading">新副本 Ready</text>
  <text x="200" y="911" text-anchor="middle" class="small">验收后才纳入接流量范围</text>
  <path d="M810 886H761" class="c"/>
  <path d="M420 886H371" class="c"/>
  <rect x="30" y="980" width="1140" height="140" rx="14" fill="#fff6e9" stroke="#e5bf83"/>
  <text x="55" y="1021" class="heading">记住三个时间差</text>
  <text x="55" y="1058">期望副本数增加 ≠ GPU 已分配 ≠ 模型已就绪。</text>
  <text x="55" y="1093" class="small">缩容也需要：停止新请求 → 排空已有请求 → 清理状态 → 退出；不能只靠固定 sleep。</text>
</svg>
