<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">8.3 两段耗时相加，为什么不等于用户等待</title>
<desc id="desc">流A内核在0到6毫秒，流B在2到8毫秒，重叠4毫秒。两个内核持续时间合计12毫秒，但图中的执行跨度8毫秒。</desc>
<defs>
<marker id="a2563eb" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/>
</marker>
<marker id="a087f67" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#087f67"/>
</marker>
<marker id="ab45309" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b45309"/>
</marker>
<marker id="ab42338" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b42338"/>
</marker>
<marker id="a7048b8" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#7048b8"/>
</marker>
<marker id="a64748b" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
</marker>
</defs>
<rect width="1200" height="900" rx="24" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="65" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">8.3 两段耗时相加，为什么不等于用户等待</text>
<text x="48" y="112" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">教学时间线：假设两个 Kernel 可以按图并行，横轴单位 ms</text>
<text x="48" y="254" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">GPU 流 A</text>
<rect x="280" y="215" width="600" height="75" rx="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<text x="580.0" y="263" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">Kernel A：6 ms</text>
<text x="48" y="404" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">GPU 流 B</text>
<rect x="480" y="365" width="600" height="75" rx="7" fill="#087f67" stroke="#ffffff" stroke-width="2"/>
<text x="780.0" y="413" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">Kernel B：6 ms</text>
<path d="M 280 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="280" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">0</text>
<path d="M 380 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="380" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">1</text>
<path d="M 480 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="480" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">2</text>
<path d="M 580 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="580" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">3</text>
<path d="M 680 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="680" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">4</text>
<path d="M 780 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="780" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">5</text>
<path d="M 880 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="880" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">6</text>
<path d="M 980 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="980" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">7</text>
<path d="M 1080 470 V 480" stroke="#64748b" stroke-width="2"/>
<text x="1080" y="513" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">8</text>
<path d="M 280 470 H 1130" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a64748b)"/>
<rect x="48" y="560" width="1104" height="136" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="72" y="607" font-size="28" fill="#b45309" font-weight="700" text-anchor="start">Kernel 时间相加：6 + 6 = 12 ms</text>
<text x="72" y="653" font-size="26" fill="#172b4d" font-weight="400" text-anchor="start">这段墙钟时间：从 0 到 8，只过了 8 ms；中间 4 ms 重叠。</text>
<rect x="48" y="739" width="1104" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="72" y="783" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start">先看请求依赖与全链路时间线，再解释算子与单个 Kernel。</text>
<text x="72" y="825" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">这里没有 CPU、排队或网络开销；真实端到端时间需另行计量。</text>
</g>
</svg>