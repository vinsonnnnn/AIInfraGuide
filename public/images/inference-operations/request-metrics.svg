<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">推理请求的四种时间指标</title>
  <desc id="desc">教学时间线，不按时间比例绘制。请求在零毫秒发送，四个 Token 分别在二百、二百二十、三百二十、三百四十毫秒到达，三百五十毫秒完成。TTFT 为二百毫秒，ITL 为二十、一百、二十毫秒，TPOT 为约四十六点七毫秒，端到端时间为三百五十毫秒。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#18324f;font-size:22px}
      .title{font-size:34px;font-weight:700}.heading{font-size:27px;font-weight:700}.small{font-size:20px}.muted{fill:#52657b}.strong{font-weight:700}.blue{fill:#245bcb}.green{fill:#17734c}.orange{fill:#a64b15}
    </style>
  </defs>
  <rect width="1200" height="900" rx="20" fill="#f1f5f9"/>
  <text x="38" y="58" class="title">一条请求，四种不同的“等多久”</text>
  <text x="38" y="94" class="small muted">假设时刻用于手算；横向位置不按时间比例，避免相邻标签挤在一起。</text>
  <rect x="30" y="120" width="1140" height="320" rx="16" fill="white" stroke="#d5e0ed"/>
  <rect x="55" y="145" width="350" height="70" rx="10" fill="#eaf1ff" stroke="#93b4ff"/>
  <text x="80" y="175" class="strong blue">首输出前的完整路径</text>
  <text x="80" y="201" class="small">入口、排队、分词、P 与网络</text>
  <rect x="440" y="145" width="440" height="70" rx="10" fill="#ebf8ef" stroke="#91d5a5"/>
  <text x="465" y="175" class="strong green">逐步输出</text>
  <text x="465" y="201" class="small">每个间隔都可能有计算、调度与传输等待</text>
  <text x="905" y="173" class="small muted">最后 Token 后</text>
  <text x="905" y="201" class="small muted">仍可能有响应尾部</text>
  <path d="M75 285H1128" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g fill="#2463db">
    <circle cx="90" cy="285" r="7"/><circle cx="400" cy="285" r="8"/>
    <circle cx="570" cy="285" r="8"/><circle cx="780" cy="285" r="8"/>
    <circle cx="950" cy="285" r="8"/><circle cx="1100" cy="285" r="7"/>
  </g>
  <text x="90" y="246" text-anchor="middle" class="strong">发送</text>
  <text x="400" y="246" text-anchor="middle" class="strong">Token 1</text>
  <text x="570" y="246" text-anchor="middle" class="strong">Token 2</text>
  <text x="780" y="246" text-anchor="middle" class="strong">Token 3</text>
  <text x="950" y="246" text-anchor="middle" class="strong">Token 4</text>
  <text x="1100" y="246" text-anchor="middle" class="strong">完成</text>
  <text x="90" y="321" text-anchor="middle">0 ms</text>
  <text x="400" y="321" text-anchor="middle">200 ms</text>
  <text x="570" y="321" text-anchor="middle">220 ms</text>
  <text x="780" y="321" text-anchor="middle">320 ms</text>
  <text x="950" y="321" text-anchor="middle">340 ms</text>
  <text x="1100" y="321" text-anchor="middle">350 ms</text>
  <path d="M90 354V370H400V354" fill="none" stroke="#2463db" stroke-width="3"/>
  <text x="245" y="404" text-anchor="middle" class="strong blue">TTFT = 200 ms</text>
  <path d="M400 354V370H570V354M780 354V370H950V354" fill="none" stroke="#22a16e" stroke-width="3"/>
  <path d="M570 354V370H780V354" fill="none" stroke="#db7a25" stroke-width="3"/>
  <text x="485" y="404" text-anchor="middle" class="green">ITL 20 ms</text>
  <text x="675" y="404" text-anchor="middle" class="orange strong">ITL 100 ms</text>
  <text x="865" y="404" text-anchor="middle" class="green">ITL 20 ms</text>
  <rect x="30" y="462" width="1140" height="170" rx="16" fill="#edf8f1" stroke="#a7d6b8"/>
  <text x="55" y="505" class="heading green">TPOT：首 Token 之后的平均间隔</text>
  <text x="55" y="551" class="heading">(340 − 200) ÷ (4 − 1) ≈ 46.7 ms</text>
  <text x="55" y="594">四个 Token，只有三个间隔；平均不到 47 ms，仍可能发生一次 100 ms 暂停。</text>
  <rect x="30" y="652" width="1140" height="130" rx="16" fill="#eaf1ff" stroke="#b5cafa"/>
  <text x="55" y="695" class="heading blue">E2E：从发送到完整响应结束</text>
  <text x="55" y="741">350 − 0 = 350 ms；不等于模型 Kernel 时间，也不等于最后一轮 Decode 时间。</text>
  <text x="40" y="826" class="small strong">读图前提：这里假设能可靠观察 Token 到达时刻。</text>
  <text x="40" y="859" class="small muted">实际流式事件可能包含多个 Token；比较工具前，核对计时边界、单位与响应尾部。</text>
</svg>
