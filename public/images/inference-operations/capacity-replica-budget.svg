<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc">
<title id="title">9.4 健康能力、故障余量和发布工位，分别算清楚</title>
<desc id="desc">峰值18，单副本6，正常需3健康副本。配置4份容忍单副本失效；剩余3份每份64条KV理想容量共192。发布时可能另需第五张卡。</desc>
<defs>
<marker id="a2563eb" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/>
</marker>
<marker id="a087f67" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#087f67"/>
</marker>
<marker id="ab45309" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b45309"/>
</marker>
<marker id="ab42338" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b42338"/>
</marker>
<marker id="a7048b8" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#7048b8"/>
</marker>
<marker id="a64748b" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
</marker>
</defs>
<rect width="1200" height="895" rx="24" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="65" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">9.4 健康能力、故障余量和发布工位，分别算清楚</text>
<text x="48" y="112" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">同一工作负载的教学假设：峰值 18 请求/s，单卡副本达标能力 6 请求/s</text>
<rect x="50" y="176" width="208" height="162" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="154" y="220" font-size="27" fill="#2563eb" font-weight="700" text-anchor="middle">副本 1</text>
<text x="154" y="271" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">1 GPU</text>
<text x="154" y="313" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">6 请求/s</text>
<rect x="273" y="176" width="208" height="162" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="377" y="220" font-size="27" fill="#2563eb" font-weight="700" text-anchor="middle">副本 2</text>
<text x="377" y="271" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">1 GPU</text>
<text x="377" y="313" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">6 请求/s</text>
<rect x="496" y="176" width="208" height="162" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="600" y="220" font-size="27" fill="#2563eb" font-weight="700" text-anchor="middle">副本 3</text>
<text x="600" y="271" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">1 GPU</text>
<text x="600" y="313" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">6 请求/s</text>
<rect x="719" y="176" width="208" height="162" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="823" y="220" font-size="27" fill="#b45309" font-weight="700" text-anchor="middle">副本 4</text>
<text x="823" y="271" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">1 GPU</text>
<text x="823" y="313" font-size="25" fill="#b45309" font-weight="700" text-anchor="middle">故障余量</text>
<rect x="942" y="176" width="208" height="162" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
<text x="1046" y="220" font-size="27" fill="#7048b8" font-weight="700" text-anchor="middle">临时新副本</text>
<text x="1046" y="271" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">1 GPU</text>
<text x="1046" y="313" font-size="25" fill="#7048b8" font-weight="700" text-anchor="middle">发布工位</text>
<rect x="48" y="385" width="1104" height="109" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="72" y="428" font-size="27" fill="#2563eb" font-weight="700" text-anchor="start">正常峰值：至少 3 份健康副本，3 × 6 = 18 请求/s。</text>
<text x="72" y="470" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">故障配置为 4 份：丢失其中 1 份后，平均能力账本仍剩 3 份。</text>
<rect x="48" y="529" width="1104" height="119" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="72" y="573" font-size="26" fill="#b45309" font-weight="700" text-anchor="start">KV 也要独立核算：剩余 3 份 × 每份理想 64 条 = 192 条。</text>
<text x="72" y="616" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">平均在场 18 × 10 = 180 条，只剩少量平均余量；突发和长尾仍需验证。</text>
<rect x="48" y="683" width="1104" height="117" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
<text x="72" y="728" font-size="27" fill="#7048b8" font-weight="700" text-anchor="start">先起新副本再撤旧副本：可能临时需要第 5 张 GPU。</text>
<text x="72" y="770" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">发布、故障和节点放置要按目标场景组合检查，不能只机械加一个副本。</text>
<text x="48" y="850" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">第四份不必空闲；图中的“余量”表达故障后仍有足够健康能力的目标。</text>
</g>
</svg>